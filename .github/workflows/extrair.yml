name: Extrair projeto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair ZIP
        run: |
          unzip -o colinha-facil-pr-tse-v2.zip -d projeto
          rm -rf projeto/.github
          cp -r projeto/* .
          rm -rf projeto
          rm -f colinha-facil-pr-mvp.zip

      - name: Salvar arquivos
        run: |
          git config user.name "colinha-facil"
          git config user.email "actions@github.com"
          git add .
          git add .
          git add .
          if git diff --cached --quiet; then
                       echo "Nenhuma alteração para salvar."
                     else
             git commit -m "Atualiza projeto"
             git push
             fi
          
